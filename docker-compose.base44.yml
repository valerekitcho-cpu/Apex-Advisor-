name: apex-advisor

services:
  web:
    image: node:22
    working_dir: /workspace
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec node --watch server.js
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FREE_QUOTA=${FREE_QUOTA:-5}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - advisor_node_modules:/workspace/node_modules
    labels:
      base44.project: "Apex Advisor"
      base44.kind: "web"
      base44.port: "3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  advisor_node_modules:
